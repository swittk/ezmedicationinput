# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# EZMedInput is a clinician-reviewed SIG suggester, NOT a prescribing safety gate.
# Review all production source, FHIR definitions and substantive clinical oracle tests.
reviews:
  profile: "chill"
  request_changes_workflow: false
  path_filters:
    # Documentation and low-signal supporting material; production source,
    # FHIR definitions, and core clinical/HPSG tests stay in the review.
    - "!.coderabbit.yaml"
    - "!AGENTS.md"
    - "!CLAUDE.md"
    - "!.github/copilot-instructions.md"
    - "!.github/pull_request_template.md"
    - "!.cursor/rules/ezmed-product.mdc"
    - "!DIRECTIONALITY.md"
    - "!HPSG_IMPLEMENTATION_GUIDE.md"
    - "!DIARY.md"
    - "!README.md"
    - "!bench/**"
    - "!experiments/boundary-planner/**"
    # This replay runner changes only the imported R6 type name; clinical
    # oracle suites, terminology coverage, and mixed distribution tests remain
    # selected. Benchmark and measurement artifacts are outside review scope.
    - "!test/real-world-fuzz-2026.spec.ts"
    # This legacy first-clause adapter has no assertions; its clinical test
    # suites remain selected, including source and conversion correctness.
    - "!test/helpers/r5-parser.ts"
    # Large aggregate suites remain in the full local test run. Focused
    # clinical, terminology and distribution suites stay selected here.
    - "!test/generation-roundtrip.spec.ts"
    - "!test/instruction-graph.spec.ts"
    - "!test/r6-primary.spec.ts"
    # This aggregate exceeds the service per-file limit; its full local
    # clinical qualification remains required.
    - "!test/opd-dogfood.spec.ts"
    # Pinned upstream reference data; handwritten FHIR definitions, public
    # types and the suites checking this contract remain selected.
    - "!fhir/r6/official-snapshot1-20261113-contract.json"
    # Beta release metadata only: package.json changes only version.
    # Dependencies, scripts, exports and published-file rules are unchanged.
    # Remove this exclusion if any non-version package field changes.
    - "!package.json"
    - "!package-lock.json"
  path_instructions:
    - path: "**/*"
      instructions: |
        MANDATORY PRODUCT CONTRACT: This is a fast, permissive, clinician-reviewed
        clinical medication SIG parser/SUGGESTER; doctors inspect, edit and approve
        results. It is NOT an autonomous prescriber, an exhaustive drug safety
        authority, or a validator that must reject all imperfect language.
        Apply these product boundaries.
        Judge changes by ordinary clinical usefulness, fidelity to
        advertised HPSG semantics, retaining all recoverable source/FHIR meaning,
        and low mobile runtime cost.
        Do NOT request hard blocks, new safety vetoes, redundant validations,
        guessed zero/empty values, or custom grammar for contrived pathological
        adversarial prose just because a test can be invented for it.
        Find real wrong-dose, wrong-eye, wrong-cadence, wrong-stage, wrong-FHIR
        bugs for competent realistic SIGs and advertised features. Partially
        understood inputs must remain useful for human review; no data deletion.
        Reviewer must classify a finding as supported/realistic or out of scope
        before proposing code. Reject/push back on suggestions that change the product.

        HARD REVIEW EXCLUSIONS, including this and every future review:
        Historical editing, reordering, deletion or replacement of previously
        exported FHIR R5/R6; stale-marker/provenance reconciliation, saved draft
        or pause restoration, and edit-history reconstruction are BEST EFFORT,
        NOT acceptance requirements. Do not propose fixes or new tests for them.
        Likewise reject hypothetical malformed or contradictory external data,
        caller mutation, class/Proxy/getter/cross-realm/descriptor accommodations,
        and contrived clinical language without established supported use.
        Earlier learned advice demanding these behaviors is superseded.
        Keep normal independently supplied valid R5/R6 import and R5-R6
        conversion, typed SIG phase sequencing, clinical scheduling/supply,
        and low-latency HPSG correctness in scope; fix real shared root defects
        rather than adding one-off guards for reviewer examples.
    - path: "src/**"
      instructions: |
        Grammar is typed HPSG, not regex rescue or FHIR post-processing;
        terminology maps exact clinical meaning; typed regimens own dependencies.
        FHIR R5/R6 conversion must preserve supplied structured data and original
        text. Suggestions do not require proof of perfect interpretation. Avoid
        redundant parsing/validation and hot-path allocations; protect phone speed.
        Scheduling utility restrictions are not blanket parser/preview rejections.
        Language packs own lexical vocabulary, language-specific licensing and
        realization. Shared clinical meaning, typed HPSG composition, execution
        and FHIR projection stay language-neutral. Reuse the existing semantic
        owner across consumers; avoid symptom-only rescue branches, duplicate
        clinical policy and speculative abstractions. When a fix touches locale-specific
        recognition or realization, move that affected logic into the existing
        language/lexical provider or reuse the existing typed lexical/grammar owner.
        Keep this extraction local, preserve registered canonical tokens and verify
        the provider path; no new scan, cache, parallel parser or framework.
        Locale providers are plain
        immutable data; receiver rebinding and caller-misuse defenses are out of scope.
        Custom formatLong overrides own their returned whole-clause text; preserve
        their full context and defaults. Native rendering retains typed dose/advice
        ownership; do not infer or repair arbitrary callback output.
    - path: "test/**"
      instructions: |
        Clinical correctness means a precise, independent oracle for realistic
        or explicitly supported instructions (laterality, dose, timing, taper,
        conditions, caps, FHIR). Unsupported bizarre adversarial strings are
        diagnostic probes, NOT requirements or acceptance tests. Do not reward
        an empty result, quarantine, rejection, or zero supply as a universal
        success; ensure best-effort meaning and source data survive.
        Review substantive behavior, not fixture mechanics, mock or boot setup,
        assertion style, speculative test-only expansion, or benchmark methodology.
    - path: "test-dist/**"
      instructions: |
        Review the built-package clinical graph, FHIR and localized preview
        assertions. Ignore boot-only packaging mechanics and test-style requests.
    - path: "fhir/**"
      instructions: |
        FHIR is a downstream meaning-preserving projection, not the grammar.
        Do not drop safety/unknown extensions, original text, or R6 details;
        do not invent zero/empty values. Keep ordinary imports displayable
        for clinician review without promising a historical edit lifecycle;
        distinguish suggestions from executable scheduling/supply.
knowledge_base:
  code_guidelines:
    enabled: false
